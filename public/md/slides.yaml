# Slide-Registry — Single Source of Truth für Overview/StoryView/TechView
#
# Ersetzt die frühere Architektur (portfolio.md -> generate_json_from_portfolio.py ->
# public/json-backup/), die Slide-Inhalte nie wirklich mechanisch aus portfolio.md
# abgeleitet hat. Diese Datei IST die Slide-Struktur + der Slide-Inhalt.
#
# Schema:
#   chapters: Liste von Kapiteln. Jedes Kapitel hat eine id, nav_label (Default-Anzeigename),
#             optional nav_label_by_view (Override je View), und eine slides-Liste.
#   Jede Slide hat: id, views (Liste der Views, die diese Slide zeigen), role (optional:
#             title/closing/abbinder), title, subtitle, content (Liste von content-items —
#             gleiche Typen wie im bisherigen JSON-Schema: figures, figures_with_context,
#             steps, chart_refs, contrasts, sequence, statement, comparison_table,
#             scenarios, recommendations, sections, tools, agenda, links).
#   view_composition: pro View die Liste der Kapitel-IDs in Anzeigereihenfolge.
#
# Content-Typen OHNE Renderer in generate_html_from_json.py (nicht verwenden!): findings, note.
# Nur die 14 oben genannten Typen sind implementiert.

chapters:

  # ---------------------------------------------------------------------
  - id: einstieg
    nav_label: Einstieg
    slides:
      - id: einstieg-title-overview
        views: [overview]
        role: title
        layout: L6
        # title/subtitle werden für die Opening-Titel-Slide automatisch aus
        # hub.tagline/hub.subtitle + view_meta.{view}.project/period generiert
        # (generate_json_from_slides.py) — hier keine Werte pflegen, sie werden
        # überschrieben. Content (KPIs) bleibt view-spezifisch von Hand gepflegt.
        content:
          - type: figures
            items:
              - {value: "94,4 M", label: "Halt-Ereignisse 2023–2025", sentiment: neutral}
              - {value: "87 %", label: "OTP · Ziel: 95 %", sentiment: negative}
              - {value: "71,3 %", label: "Haltestellen ohne Puffer", sentiment: warning}
              - {value: "18,56 s", label: "Vorhersage-MAE LightGBM v2", sentiment: positive}

      - id: einstieg-title-storyview
        views: [storyview]
        role: title
        layout: L6
        # title/subtitle automatisch aus hub (siehe Kommentar oben)
        content:
          - type: figures
            items:
              - {value: "94,4 M", label: "Halt-Ereignisse", sentiment: neutral}
              - {value: "87 %", label: "OTP heute · Ziel: 95 %", sentiment: negative}
              - {value: "18,56 s", label: "MAE LightGBM v2", sentiment: positive}
              - {value: "−63 %", label: "vs. Baseline", sentiment: positive}

      - id: einstieg-title-techview
        views: [techview]
        role: title
        layout: L6
        # title/subtitle automatisch aus hub (siehe Kommentar oben)
        content:
          - type: figures
            items:
              - {value: "94,4 M", label: "Halt-Ereignisse, 4 Datenquellen", sentiment: neutral}
              - {value: "50,0 s", label: "Baseline MAE (Stop Mean)", sentiment: neutral}
              - {value: "18,56 s", label: "LightGBM v2 MAE (Test 2025)", sentiment: positive}
              - {value: "−63 %", label: "Verbesserung vs. Baseline", sentiment: positive}

      - id: einstieg-these
        views: [storyview]
        title: "Übergreifende These"
        subtitle: "Ein Satz, der das gesamte Projekt trägt"
        content:
          - type: statement
            sentiment: neutral
            layout: lead_copy
            text: "Die Verspätungen im Zürcher Tramnetz sind vorhersagbar — weil sie im Fahrplan-Design verankert sind, nicht im zufälligen Betrieb."
            copy: "Was vorhersagbar ist, ist steuerbar. Das Modell bestätigt die Analyse: prev_trip_delay ist das stärkste neue Feature in v2, MAE sinkt von 45,7 s auf 18,56 s. Fahrplan-Redesign an L11 ist der Hebel."

      - id: einstieg-agenda-overview
        views: [overview]
        layout: L6
        kicker: "Agenda"
        title: "Inhaltsübersicht"
        subtitle: "Die wichtigsten Informationen mit Fokus auf Business-Impact"
        content:
          - type: agenda
            items:
              - "Ausgangssituation"
              - "Exploration / EDA"
              - "Data Preprocessing"
              - "Analyse & Erkenntnisse"
              - "Machine Learning"
              - "Praxisanwendung"
              - "Empfehlungen"
              - "Technische Umsetzung"
              - "Ausblick"

      - id: einstieg-agenda-storyview
        views: [storyview]
        layout: L6
        kicker: "Agenda"
        title: "Inhaltsübersicht"
        subtitle: "Der gesamte Daten-Lifecycle von Rohdaten bis Vorhersage-Modell"
        content:
          - type: agenda
            items:
              - "Ausgangssituation"
              - "Exploration / EDA"
              - "Data Preprocessing"
              - "Analyse & Erkenntnisse"
              - "Machine Learning"
              - "Praxisanwendung"
              - "Empfehlungen"
              - "Technische Umsetzung"
              - "Ausblick"

      - id: einstieg-agenda-techview
        views: [techview]
        layout: L6
        kicker: "Agenda"
        title: "Inhaltsübersicht"
        subtitle: "Die wichtigsten Technical Insights als Data-Science Deep-Dive"
        content:
          - type: agenda
            grouped: true
            items:
              - section: "Ausgangssituation"
                slides: ["OTP-Lücke und Datenlage"]
              - section: "Datenstrategie"
                slides: ["Datenquellen und Integration", "Cleaning-Entscheidungen"]
              - section: "Baseline"
                slides: ["Stop Mean als Benchmark"]
              - section: "Feature Engineering"
                slides: ["32 Features v1 · Kaskadenindikator v2"]
              - section: "Modellauswahl"
                slides: ["Warum LightGBM", "v1 · v2 · Robustheits-Check"]
              - section: "Evaluation & Ausblick"
                slides: ["Feature Importance", "Produktionsreife & Reflexion", "Handlungsempfehlungen"]

  # ---------------------------------------------------------------------
  # Kanonische Slide, identisch in allen 3 Views (Kay-Entscheidung 2026-07-01:
  # KPI-Set 87/95/-8%/56,3s überall, kein 71,5%-Swap in TechView mehr).
  - id: ausgangssituation
    nav_label: Ausgangssituation
    slides:
      - id: ausgangssituation-otp-gap
        views: [overview, storyview, techview]
        title: "Strukturelle Lücke im Netz"
        subtitle: "87 % OTP seit drei Jahren — dauerhaft unter dem VBZ-Ziel von 95 %"
        content:
          - type: figures_with_context
            items:
              - value: "87 %"
                label: "OTP 2023–2025\n(netzweit)"
                sentiment: negative
                context: "Ist-Zustand 2023–2025: 87 % netzweit. Konstant unter dem VBZ-Zielwert, über alle drei Betriebsjahre ohne erkennbaren Aufwärtstrend."
              - value: "95 %"
                label: "VBZ-Ziel\nbis 2028"
                sentiment: positive
                context: "VBZ-Zielwert: 95 % OTP (On-Time Performance, Ankunft ≤ 2 Minuten Verspätung)"
              - value: "−8 %"
                label: "Strukturelle\nLücke"
                sentiment: negative
                context: "Der Rückstand ist systemisch, nicht episodisch — er taucht in jedem Jahr, auf jeder Linie auf."
              - value: "56,3 s"
                label: "Ø Ankunfts-\nverspätung"
                sentiment: warning
                context: "Jede achte Tramfahrt überschreitet den 2-Minuten-Schwellwert. Stabil über alle drei Betriebsjahre."

      - id: ausgangssituation-vorgehen
        views: [overview, storyview, techview]
        title: "Vorgehen in zwei Schritten"
        subtitle: "Von der Ursachenanalyse zur Vorhersage"
        content:
          - type: h_timeline
            items:
              - label: "Analyse"
                text: "Identifikation der Entstehungsmuster und Einflussfaktoren. Analyse in 6 Dimensionen: Temporal · Räumlich · Netzwerk · Meteorologie · Events · Zieldefinition."
              - label: "Vorhersage"
                text: "Machine-Learning Modelling für die Verspätungsvorhersage. Folgen sie Mustern, die ein Modell lernen kann? — LightGBM, MAE 18,56 s (arrival_delay in Sekunden), −63 % vs. Baseline."

      - id: ausgangssituation-otp-per-line
        views: [overview, storyview]
        title: "Alle Linien nicht im Soll"
        subtitle: "Keine einzige Linie erreicht dauerhaft das Ziel<br>Die Lücke zieht sich durch das gesamte Netz"
        content:
          - type: chart_refs
            items:
              - label: "OTP nach Tramlinien"
                source: target-otp-per-line
                caption: "OTP nach Tramlinien, 2023–2025. Alle 16 Linien liegen unter dem 95 %-Ziel."

      - id: ausgangssituation-otp-trend
        views: [overview, storyview]
        title: "Kein Aufwärtstrend erkennbar"
        subtitle: "OTP schwankt saisonal, aber der Mittelwert bewegt sich seit 2023 nicht"
        content:
          - type: chart_refs
            items:
              - label: "OTP Jahresverlauf"
                source: target-otp
                caption: "OTP-Jahresverlauf netzweit. Die Lücke zum VBZ-Ziel ist konstant und zeigt keinen Aufwärtstrend."

  # ---------------------------------------------------------------------
  # Overview nennt das Kapitel "Ueberraschungen" (Business-Framing als Hook),
  # StoryView nennt es "Exploration" (Prozess-Framing, EDA-Phase) — bewusst
  # unterschiedliche Framings fuer unterschiedliche Zielgruppen, gleiche 3
  # Kern-Slides (Wortlaut vereinheitlicht, war zuvor leicht unterschiedlich).
  - id: ueberraschungen
    nav_label: Überraschungen
    # Kapitel-Name an StoryView angeglichen (Kay-Feedback 2026-07-14: "Kapitel-Namen und Struktur
    # sollten wir an StoryView angleichen") — die frühere bewusste Framing-Differenz Überraschungen
    # (Business-Hook) vs. Exploration (Prozess) ist damit aufgehoben, beide Views heissen jetzt gleich.
    nav_label_by_view:
      storyview: Exploration / EDA
      overview: Exploration / EDA
    # Nav-Tick-Kürzung nur hier (Kay-Entscheidung 2026-07-14, kein generelles Kürzungssystem):
    # Caption/Inhaltsverzeichnis zeigen den vollen Namen, die Nav-Leiste unten (wenig Platz) nur "Exploration".
    nav_tick_by_view:
      storyview: Exploration
      overview: Exploration
    slides:
      - id: ueberraschungen-widerlegte-annahmen
        views: [overview, storyview]
        title: "Widerlegte Annahmen"
        subtitle: "Drei initiale Annahmen wurden mit Befunden aus den Daten klar widerlegt"
        content:
          - type: contrasts
            items:
              - topic: "Stadtzentrum"
                assumption: "Die Innenstadt ist der Verspätungs-Hotspot"
                finding: "Central (48,3 s) und Paradeplatz (48,2 s) liegen unter dem Netzschnitt. Hotspots: Enzenbühl 93,8 s, Balgrist 85,2 s — periphere Aussenkorridore"
              - topic: "Berufsverkehr"
                assumption: "Der Morgenrush ist das grösste Zeitproblem"
                finding: "7h liegt mit 48,9 s unter Netzschnitt. Echter Peak: 21h (67,9 s) durch Abreisewellen nach Veranstaltungen. Donnerstag ist der schlechteste Wochentag"
              - topic: "Wettereinfluss"
                assumption: "Schlechtes Wetter ist die Hauptursache"
                finding: "Schnee ist ein Verstärker (+54 s), Regen +23,3 s. Geografisch trennbar: Schnee trifft Höhenlagen (K10/K12), Regen Flusstäler (K5). Grundrauschen bleibt wetterunabhängig"

      - id: ueberraschungen-innenstadt-map
        views: [overview, storyview]
        title: "Innenstadt ist pünktlicher"
        subtitle: "Räumlich: Verspätungs-Hotspots liegen an der Peripherie, nicht im Stadtzentrum"
        content:
          - type: chart_refs
            layout: image_right
            items:
              - label: "Verspätungshotspots nach Haltestelle"
                source: spatial-stop-delay-map
                caption: "Ø Ankunftsverspätung pro Haltestelle. Hotspots ausschliesslich in peripheren Stadtkreisen 7, 11, 12."

      - id: ueberraschungen-peak-abend
        views: [overview, storyview]
        title: "Peak am Abend"
        subtitle: "Temporal: Um 21 Uhr entstehen die höchsten Verspätungen — nicht im Morgenrush<br>Der Peak um 2 Uhr ist ein Artefakt des Nachtbetriebs — bei minimaler Fahrtenzahl wirkt jede einzelne Verspätung überproportional gross"
        content:
          - type: chart_refs
            items:
              - label: "Delay nach Tageszeit"
                source: temporal-hour-of-day
                caption: "Ø Delay nach Tageszeit (0–23h). Peak 21h, nicht 7h. Abend-Effekt durch Veranstaltungs-Abreisewellen."

      - id: ueberraschungen-wetter
        views: [storyview]
        title: "Weitere Eindrücke"
        subtitle: "Erste Kennzahlen aus der explorativen Datenanalyse"
        content:
          - type: figures
            items:
              - {value: "+54 s", label: "Schnee-Effekt netzweit", sentiment: negative}
              - {value: "+23,3 s", label: "Regen-Effekt netzweit", sentiment: warning}
              - {value: "−9,9 s", label: "Feiertage vs. Normal", sentiment: positive}
              - {value: "66,0 s", label: "Fachmessen (schlechteste Event-Kategorie)", sentiment: negative}
          - type: sections
            layout: columns
            items:
              - label: "Einordnung"
                points:
                  - "Feiertage sind der beste Tagestyp: −9,9 s vs. Normal"
                  - "Der Rückgang des motorisierten Individualverkehrs (MIV) an Feiertagen überwiegt jeden Event-Effekt"
                  - "Event-Wirkung ist ein Abend-Phänomen (18–22h): tagsüber kein messbarer Unterschied"

  # ---------------------------------------------------------------------
  - id: data-engineering
    nav_label: Data Preprocessing
    nav_label_by_view:
      techview: Datenstrategie
    slides:
      # TechView-exklusiver Einstieg (Kay-Feedback 2026-07-14): Übersichtsbild aus zh-tram-data
      # (dort: "Die Join-Pipeline") als guter visueller Einstieg vor den Datenquellen-Details.
      - id: data-engineering-join-overview-techview
        views: [techview]
        title: "Die Datenstrategie"
        subtitle: "Fünf Quellen, ein reproduzierbarer Weg zum Master-Datensatz"
        content:
          - type: chart_refs
            items:
              - label: "VBZ Data Pipeline — Big Picture"
                source: vbz_strategy.svg
                caption: "Von den Rohdaten (IST-Daten, GTFS, Meteo, Events, Geo) über Filterung und Interim-Parquets bis zum gemeinsamen Merge auf vbz_master.parquet — die vollständige Herkunft und Genese der Daten, bevor die einzelnen Quellen auf den folgenden Slides im Detail folgen.<br>Quelle: Datenpipeline aus dem Schwesterprojekt zh-tram-data."

      - id: data-engineering-sources-primary
        views: [overview, storyview, techview]
        title: "Master-Datensatz und GTFS-Fahrplandaten"
        subtitle: "Data Refinement als Fundament mit initialen Master-Datensatz und GTFS Fahrplandaten"
        content:
          - type: sections
            items:
              - label: "VBZ IST-Daten (Primärquelle)"
                points:
                  - "Reale Ankunfts- und Abfahrtszeiten aller Tramhalte 2023–2025"
                  - "Granularität: Fahrt × Haltestelle × Timestamp"
                  - "Enthält canceled = True Fahrten — bewusst behalten (relevante Extremfälle)"
              - label: "GTFS (Fahrplandaten)"
                points:
                  - "Geplante Ankunfts-/Abfahrtszeiten, dwell_time, stop_sequence"
                  - "Liniengeometrien und Haltestellen-Koordinaten (lat/lon)"
                  - "Join-Key: trip_id × stop_id × service_date"
          - type: text_columns
            items:
              - heading: "Master-Datensatz"
                text: "Der Master-Datensatz entsteht in zh-tram-data aus den VBZ IST-Daten, angereichert um GTFS, Meteo Schweiz und Event-Kalender — 94,4 Mio. Zeilen, 26 Features. Er liefert die Basis für alle Analysen in diesem Projekt."
              - heading: "GTFS (Fahrplandaten)"
                text: "Für Karten, Geo-Visualisierungen und Tramlinien-Darstellungen wurde GTFS zusätzlich gesondert geladen — der Master-Datensatz allein liefert keine Liniengeometrien und Streckenverläufe."

      - id: data-engineering-sources-context
        views: [overview, storyview, techview]
        title: "Kontextquellen der Dimensionen"
        subtitle: "Für jede Analysedimension wurden die Datenquellen im Vorfeld im Master-Datensatz schon kontextuell angereichert"
        content:
          - type: sections
            items:
              - label: "Meteo Schweiz"
                points:
                  - "Stündliche Messwerte: Temperatur, Niederschlag, Windgeschwindigkeit"
                  - "Join über Zeitstempel (hour-level) auf IST-Daten"
                  - "Abgeleitete Flags: has_rain, has_snow, has_heavy_rain, is_hot"
              - label: "Event-Kalender"
                points:
                  - "Grossveranstaltungen Zürich 2023–2025: Konzerte, Messen, Sport"
                  - "Kategorisierung: event_type, event_size, event_weight"
                  - "Ergebnis: 94,4 Mio. Zeilen · 26 Features · 541 MB Parquet"
              - label: "Network"
                points:
                  - "Linientopologie: 16 Linien, ca. 190 Haltestellen"
                  - "Kontext-Features: n_lines_at_stop, n_stops_line"
                  - "Basis für linienübergreifendes Lernen (stop_sequence_pct)"
              - label: "Target"
                points:
                  - "arrival_delay in Sekunden, aus IST- vs. Soll-Zeit berechnet"
                  - "OTP-Schwellwert: Ankunft ≤ 2 Minuten Verspätung"
                  - "canceled = True bewusst als Extremfall im Target erhalten"

      - id: data-engineering-cleaning-storyview
        views: [storyview]
        title: "Cleaning, Split und Encoding"
        subtitle: "Mit der passenden Data Preparation zur finalen Struktur für das Modell"
        content:
          - type: contrasts
            items:
              - topic: "Canceled-Flag"
                assumption: "Canceled-Fahrten entfernen"
                finding: "Bewusst behalten: canceled = True Fahrten sind Extremfälle, die das Modell kennen muss. Entfernen würde die Realität des Netzes verfälschen."
              - topic: "Split-Type"
                assumption: "Shuffle-Split für mehr Trainingsdaten"
                finding: "Temporal Split (kein Shuffle): Train 2023–Jun 2024 / Val Jul–Dez 2024 / Test 2025. Data Leakage wäre sonst unvermeidbar."
              - topic: "OHE für Haltestellen"
                assumption: "Haltestellen über One-Hot Encoding"
                finding: "Native Categoricals in LightGBM: stop_name, line_name, event_type direkt als Kategorie. Kein Dimensionsproblem, schnelleres Training."

      - id: data-engineering-cleaning-techview-1
        views: [techview]
        title: "Datenstrategie"
        subtitle: "Cleaning-Entscheidungen und ihre Begründungen (1/2)"
        content:
          - type: contrasts
            items:
              - topic: "Canceled-Flag"
                assumption: "Canceled-Fahrten entfernen"
                finding: "Behalten: canceled = True Zeilen sind relevante Extremfälle — Modell soll auch Ausfälle antizipieren können"
              - topic: "Split-Type"
                assumption: "Shuffle-Split für mehr Trainingsdaten"
                finding: "Temporal Split: Zukunft darf Vergangenheit nicht kennen. Shuffle würde Data Leakage erzeugen"

      - id: data-engineering-cleaning-techview-2
        views: [techview]
        title: "Datenstrategie"
        subtitle: "Cleaning-Entscheidungen und ihre Begründungen (2/2)"
        content:
          - type: contrasts
            items:
              - topic: "Extremwert-Capping"
                assumption: "arrival_delay winsorisieren (Extremwerte kappen)"
                finding: "Kein Capping: MAE belohnt Präzision auch bei Extremwerten. Winsorisierung würde Systemfehler verbergen"
              - topic: "OHE für Haltestellen"
                assumption: "Alle Haltestellen gleich behandeln"
                finding: "stop_sequence_pct als normierter Streckenfortschritt — erlaubt linienübergreifendes Lernen ohne One-Hot-Explosion"

  # ---------------------------------------------------------------------
  - id: baseline
    nav_label: Baseline
    slides:
      - id: baseline-table
        views: [techview]
        title: "Baseline"
        subtitle: "Stop Mean als sinnvollster naiver Benchmark"
        content:
          - type: comparison_table
            columns: ["Ansatz", "Logik", "MAE (Test)"]
            rows:
              - cells: ["Grand Mean", "Immer Netz-Ø vorhersagen (56,3 s)", "50,6 s"]
                highlight: false
              - cells: ["Hour Mean", "Ø nach Tagesstunde", "50,5 s"]
                highlight: false
              - cells: ["Line Mean", "Ø nach Linie", "50,4 s"]
                highlight: false
              - cells: ["Stop Mean", "Ø nach Haltestelle (stärkste naive Baseline)", "50,0 s"]
                highlight: true
          - type: statement
            sentiment: neutral
            layout: lead_copy
            align: left
            text: "Stop Mean gewinnt —<br>weil Haltestellen strukturell unterschiedlich sind."
            copy: "Grand Mean, Hour Mean und Line Mean liegen alle innerhalb 1 Sekunde beieinander — reine Mittelwert-Strategien nach Zeit oder Linie bringen keinen Vorteil. Erst die Aufschlüsselung nach Haltestelle trifft den strukturellen Unterschied im Delay-Level. Jedes Modell muss diesen Benchmark schlagen."

  # ---------------------------------------------------------------------
  - id: feature-engineering
    nav_label: Feature Engineering
    slides:
      - id: feature-engineering-overview
        views: [techview]
        title: "Feature Engineering"
        subtitle: "32 Features v1, 34 Features v2 — der entscheidende Unterschied"
        content:
          - type: sections
            items:
              - label: "Temporale Features (v1)"
                points:
                  - "hour, weekday, month, season, year"
                  - "is_weekend, is_november, is_holiday"
                  - "is_late_night_weekend (Kombinations-Feature)"
              - label: "Netz-Features (v1)"
                points:
                  - "line_name, stop_name (native categoricals — kein One-Hot)"
                  - "district_nr, n_lines_at_stop, n_stops_line"
                  - "is_start_stop, is_end_stop, dwell_time"
              - label: "Externe Features (v1)"
                points:
                  - "temperature, precipitation, wind_speed"
                  - "has_rain, has_heavy_rain, has_snow, has_flood, is_hot"
                  - "has_event, event_type, event_size, event_weight, event_weight_x_hour"
              - label: "Kaskaden-Features (neu in v2)"
                highlight: true
                points:
                  - "prev_trip_delay: Verspätung des Vorgänger-Trips an diesem Halt — echtzeit-verfügbar"
                  - "stop_sequence_pct: normierter Streckenfortschritt (0–1) — linienübergreifend lernbar"
                  - "Ergebnis: MAE 45,7 s → 18,56 s, −63 %"

  # ---------------------------------------------------------------------
  # Shared, erweitert: die 3 zusaetzlichen "statement"-Bloecke waren zuvor
  # nur in Overview, wurden aber inhaltlich sinnvoll ergaenzt (Kay: Storyview
  # soll die vollstaendigste Erzaehlung sein).
  - id: erkenntnis
    nav_label: Erkenntnis
    nav_label_by_view:
      storyview: Analyse & Erkenntnisse
      overview: Analyse & Erkenntnisse
    slides:
      - id: erkenntnis-kaskade-zahlen
        views: [overview, storyview]
        title: "Kaskade der Verspätungen"
        subtitle: "Ohne Puffer im Fahrplan überträgt sich jede Verspätung auf die Folgefahrten — in Zahlen"
        content:
          - type: figures
            items:
              - {value: "71,5 %", label: "Halte akkumulieren Delay", sentiment: warning}
              - {value: "L11", label: "68,7 s · OTP 82 % — stärkste Akkumulation", sentiment: negative}
              - {value: "71,3 %", label: "Haltestellen ohne Standzeit (0 s)", sentiment: warning}
              - {value: "r ≥ 0,85", label: "Kaskadenkorrelation alle 16 Linien", sentiment: negative}
          - type: statement
            sentiment: negative
            layout: lead_copy
            text: "Was an einem Halt beginnt, endet nicht dort:"
            copy: "Ohne Standzeit-Puffer überträgt sich jede Verspätung strukturell auf die Folgefahrt — messbar auf allen 16 Linien, am stärksten auf L11."

      - id: erkenntnis-kaskade-mechanismus
        views: [overview, storyview]
        title: "Aufbau der Kaskade"
        subtitle: "Vier Schritte, vom ersten Anzeichen bis zum netzweiten Beweis"
        content:
          - type: sequence
            items:
              - label: "Anomalie"
                text: "Hotspots an Endstationen, nicht an zentralen Knotenpunkten. Null Überschneidung mit den dichtest bedienten Haltestellen."
              - label: "Gradient"
                text: "Der Delay wächst entlang der Strecke. L11: Verspätung am Streckenende doppelt so hoch wie am Anfang."
              - label: "Mechanismus"
                text: "71,3 % aller Haltestellen haben 0 Sekunden eingeplante Standzeit. Kein Puffer, keine Erholung möglich."
              - label: "Kaskade"
                sentiment: negative
                text: "Pearson r ≥ 0,85 zwischen aufeinanderfolgenden Halts auf allen 16 Linien. Systematisch, kein Einzelfall."

      - id: erkenntnis-kaskade-kernaussage
        views: [overview, storyview]
        title: "Fahrplan-Design-Thema"
        subtitle: "Die Verspätungen sind durch die Fahrplangestaltung strukturell angelegt"
        content:
          - type: statement
            sentiment: neutral
            text: "<span class=\"sw-normal\">Das ist kein Betriebsversagen.</span><br><br>Es ist ein Fahrplan-Design-Thema.<br><span class=\"sw-normal\">Was im Fahrplan nicht vorgesehen ist, kann im Betrieb nicht ausgeglichen werden.</span>"

      - id: erkenntnis-kaskade-einordnung
        views: [overview, storyview]
        title: "Einfluss externer Faktoren"
        subtitle: "Wetter und Grossevents wirken, das Grundproblem bleibt strukturell"
        content:
          - type: statement
            sentiment: warning
            heading: "Wetter & Events"
            text: "Zwei externe Einflussfaktoren sind messbar und erheblich: Schnee (+54 s) und Grossevents (bis +66 s bei Fachmessen). Doch das Grundniveau der Verspätung bleibt auch bei optimalen Bedingungen konstant hoch. Externe Faktoren verstärken, was intern bereits strukturell angelegt ist."
          - type: statement
            sentiment: positive
            heading: "Betriebsbedingte Faktoren"
            text: "Trotz Bauphasen, Streckensperrungen und Fahrplanumstellungen hält die VBZ das System bemerkenswert stabil. Die Verspätungslevel schwanken durch diese Eingriffe kaum. Die Ursache liegt nicht in externen Störungen, sondern im Fahrplan-Design selbst."

  # ---------------------------------------------------------------------
  # Overview + StoryView teilen die "Drei Iterationen"-Tabelle (kanonisch, 4 Spalten).
  # TechView hat eine bewusst reichhaltigere 5-Spalten-Tabelle (MBE + OTP) unter eigenem
  # Titel — legitime technische Vertiefung, keine Inkonsistenz (Kay-Entscheidung: nur
  # den Feature-Zahlen-Fehler 34/36 -> 32/34 korrigieren, Struktur nicht erzwingen).
  - id: modell-progression
    nav_label: Das Modell
    nav_label_by_view:
      storyview: Machine Learning
      overview: Machine Learning
      techview: Modellauswahl
    slides:
      - id: modell-drei-iterationen
        views: [overview, storyview]
        title: "Dynamische Modelle statt starrer Regeln"
        subtitle: "Herkömmliche Systeme scheitern an nichtlinearen Daten"
        content:
          - type: statement
            sentiment: neutral
            layout: lead_copy
            text: "Die Struktur der Daten ist nicht linear."
            copy: "Linie × Haltestelle × Tageszeit × Wetter × Event interagieren auf eine Weise, die kein handcodiertes Modell erfassen kann — und prev_trip_delay liefert ein Echtzeit-Signal für einen Feedback-Loop im Modell."

      - id: modell-drei-iterationen-tabelle
        views: [overview, storyview]
        title: "Drei Iterationen der Modellierung"
        subtitle: "Von der Baseline über Feature Engineering zum finalen Ensemble-Modell"
        content:
          - type: comparison_table
            columns: ["Ansatz", "Features", "MAE (Test)", "Verbesserung"]
            rows:
              - cells: ["Baseline (Stop Mean)", "—", "50,0 s", "Ausgangspunkt"]
                highlight: false
              - cells: ["LightGBM v1 — Zeit · Wetter · Netz-Features · kein Live-Signal · MBE +8,3 s", "32", "45,7 s", "−4,3 s"]
                highlight: false
              - cells: ["LightGBM v2 — +prev_trip_delay · +stop_sequence_pct · Isotonic-Kalibrierung · MBE −0,69 s", "34", "18,56 s", "−31,4 s (−63 %)"]
                highlight: true
          - type: statement
            sentiment: positive
            layout: lead_copy
            text: "Feature Engineering schlägt Hyperparameter-Tuning."
            copy: "Der Sprung von v1 auf v2 kam nicht durch einen besseren Algorithmus. Das richtige Signal aus der Analyse wurde mit dem Kaskadenindikator (prev_trip_delay) sichtbar gemacht."

      - id: modell-mae-hero-overview
        views: [overview]
        title: "18,56 Sekunden MAE"
        subtitle: "Mittlerer Vorhersagefehler auf einem vollständigen, ungesehenen Testjahr — 63 % unter der Baseline"
        content:
          - type: figures
            hero:
              value: "18,56 s"
              label: "mittlerer Vorhersagefehler (MAE) · getestet auf dem vollständigen Jahr 2025"
              sentiment: positive
            items:
              - {value: "41 Mio.", label: "Trainings-Fahrten 2023 bis Mitte 2024", sentiment: neutral}
              - {value: "~29 Mio.", label: "Test-Fahrten, vollständiges Jahr 2025", sentiment: neutral}
              - {value: "−63 %", label: "Verbesserung vs. Baseline (Stop Mean)", sentiment: positive}
          - type: statement
            sentiment: positive
            layout: lead_copy
            text: "Kalibrierter Bias"
            copy: "−0,69 Sekunden Mean Bias Error nach Isotonic-Regression-Kalibrierung — das Modell ist nahezu verzerrungsfrei. Trainiert auf Consumer-Hardware in ca. 18 Minuten, reproduzierbar ohne Spezial-Infrastruktur."

      - id: modell-mae-hero-storyview
        views: [storyview]
        title: "18,56 Sekunden MAE"
        subtitle: "Mittlerer Vorhersagefehler auf einem vollständigen, ungesehenen Testjahr — 63 % unter der Baseline"
        content:
          - type: figures
            hero:
              value: "18,56 s"
              label: "MAE · LightGBM v2 · Test 2025 (~29 M Fahrten)"
              sentiment: positive
            items:
              - {value: "41 Mio.", label: "Trainings-Fahrten 2023–Jun 2024", sentiment: neutral}
              - {value: "~29 Mio.", label: "Test-Fahrten vollständiges Jahr 2025", sentiment: neutral}
              - {value: "−0,69 s", label: "MBE nach Isotonic-Regression-Kalibrierung", sentiment: positive}
          - type: statement
            sentiment: positive
            layout: lead_copy
            text: "18,56 Sekunden bestätigen die Analyse."
            copy: "prev_trip_delay erklärt den Sprung von 45,7 s auf 18,56 s MAE. Das Signal war in den Daten — die EDA hat es zuerst aufgezeigt, das Modell hat es bestätigt."

      # StoryView-exklusive Variante von feature-importance-chart (siehe Kapitel "feature-importance"
      # unten) — für StoryView bewusst KEIN eigenes Kapitel/keine eigene Nav-Tick, sondern als reguläre
      # Slide innerhalb "Machine Learning" (Kay-Entscheidung 2026-07-14: Feature Importance ist Teil der
      # ML-Erzählung, kein eigenständiges Thema). TechView behält sein eigenes Kapitel unverändert.
      - id: modell-feature-importance-storyview
        views: [storyview]
        title: "Feature Importance"
        subtitle: "prev_trip_delay und stop_sequence_pct dominieren<br>Temporale und Wetter-Features zeigen konsistente, aber schwächere Beiträge"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - label: "Feature Importance LightGBM v2"
                source: model-feature-importance
          - type: statement
            sentiment: positive
            text: "Die Kaskadenanalyse (r ≥ 0,85) hat die Feature-Wichtigkeit korrekt antizipiert — das Signal steckt in den Daten, nicht im Algorithmus."

      - id: modell-modellauswahl-warum-lightgbm-1
        views: [techview]
        title: "Modellauswahl und -Anpassung"
        subtitle: "Warum LightGBM (1/2)"
        content:
          - type: contrasts
            items:
              - assumption: "XGBoost als Standard-Benchmark"
                finding: "XGBoost: val MAE ~21,4 s bei 150 Runden auf 85M Zeilen — über 90 Minuten Trainingszeit. LightGBM: vergleichbare Qualität in ca. 18 Minuten. Klare Wahl für iteratives Arbeiten."
              - assumption: "Native Categoricals über One-Hot Encoding"
                finding: "LightGBM verarbeitet Kategorien nativ — kein One-Hot für line_name, stop_name, event_type. Weniger Speicher, schnelleres Training, keine künstliche Sparsität."

      - id: modell-modellauswahl-warum-lightgbm-2
        views: [techview]
        title: "Modellauswahl und -Anpassung"
        subtitle: "Warum kein Hyperparameter-Tuning (2/2)"
        content:
          - type: contrasts
            items:
              - assumption: "Hyperparameter-Tuning vor Feature Engineering"
                finding: "Bewusste Entscheidung dagegen: Feature Engineering bringt mehr als Tuning auf schwachen Features. prev_trip_delay allein liefert −27s MAE. Tuning käme danach."
              - assumption: "Early Stopping als Tuning-Ersatz"
                finding: "Early Stopping mit Validation-Set steuert Modellkomplexität automatisch. Verhindert Overfitting ohne manuelle Suche nach n_estimators."

      - id: modell-modellauswahl-v1-v2
        views: [techview]
        title: "Modellauswahl und -Anpassung"
        subtitle: "v1 zu v2: der Sprung kam aus der Analyse, nicht aus dem Algorithmus"
        content:
          - type: comparison_table
            columns: ["Version", "Neue Features", "MAE (Test)", "MBE (Test)", "OTP-Verbesserung"]
            rows:
              - cells: ["Baseline (Stop Mean)", "—", "50,0 s", "—", "—"]
                highlight: false
              - cells: ["LightGBM v1", "32 Features (Zeit · Wetter · Netz)", "45,7 s", "+8,3 s", "71,9 % → 77,5 %"]
                highlight: false
              - cells: ["LightGBM v2", "+prev_trip_delay, +stop_sequence_pct (34 total)", "18,56 s", "−0,69 s", "→ kalibriert"]
                highlight: true
          - type: statement
            sentiment: positive
            layout: lead_copy
            align: left
            text: "Der Sprung kam aus der Analyse, nicht aus dem Algorithmus."
            copy: "v1 war systematisch zu optimistisch (MBE +8,3 s), v2 kalibriert auf MBE −0,69 s. Der Sprung auf 18,56 s MAE (−63 %) erklärt sich vollständig durch das neue Feature prev_trip_delay — nicht durch ein besseres Modell."

      - id: modell-robustheits-check
        views: [techview]
        title: "Robustheits-Check"
        subtitle: "XGBoost-Vergleich und Stabilitätsprüfung"
        content:
          - type: figures
            items:
              - {value: "~21,4 s", label: "XGBoost val MAE (150 Runden)", sentiment: warning}
              - {value: "90+ Min", label: "XGBoost Trainingszeit auf 85M Zeilen", sentiment: negative}
              - {value: "18 Min", label: "LightGBM v2 Trainingszeit", sentiment: positive}
              - {value: "18,56 s", label: "LightGBM v2 Test MAE (2025)", sentiment: positive}
          - type: statement
            sentiment: neutral
            layout: lead_copy
            align: left
            text: "Eine Workflow-Entscheidung, keine Qualitätskompromittierung."
            copy: "XGBoost erreicht auf dem Validation-Set vergleichbare Qualität, braucht aber 5× mehr Trainingszeit. Für iteratives Feature Engineering über mehrere Wochen ist LightGBM die klar überlegene Wahl."

