<!DOCTYPE html>
<!--
  SLIDES TEMPLATE — Workspace Portfolio
  ======================================
  Basis für /project-case slides.
  Enthält: CSS-Klassen · Reveal.js CDN · JavaScript-Handler
  KEIN Projektinhalt — wird von /project-case slides befüllt.

  Farbpalette:
    Dunkelblau:  #1a3a5c  (Titel, starke Texte)
    Hellblau:    #2E86AB  (Akzent, Links, h3)
    Grün:        #27ae60  (gut, done, positiv)
    Orange:      #e67e22  (aktiv, Warnung)
    Rot:         #c0392b  (Problem, schlecht)

  CSS-Klassen (vollständig):
    Layout:       .cols .w40 .w45 .w55 .w60
    Boxen:        .box .box-green .box-orange
    Metriken:     .metric-row .metric .metric.good .metric.warn .metric.bad
    Pipeline:     .pipe-step .pipe-step.done .pipe-step.active .pipe-step.planned
    DE-Steps:     .step .step.join .step.target
    Evidence:     .ev-chain .ev-step .ev-circle .ev-body .ev-arrow .ev-step.climax
    Modell:       .model-card .model-card.card-green .card-badge .card-mae .card-note
    Empf.:        .reco .reco-num .reco-text
    Charts:       .chart-tile .chart-tile-html
    Vorhersage:   .prediction-card .pred-grid .pred-field .pred-btn .pred-result
    Slides:       .title-slide .thesis-slide .slide-sub
    Tabellen:     tr.hl tr.hl-green tr.pending
    Progress:     .progress-marker .progress-label
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- PROJECT TITLE --></title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">

  <style>
    /* === Basis === */
    .reveal { font-size: 22px; }
    .reveal h1 { font-size: 2.4em; color: #1a3a5c; letter-spacing: -0.01em; text-align: left; }
    .reveal h2 { font-size: 1.4em; color: #1a3a5c; border-bottom: 2px solid #2E86AB; padding-bottom: 6px; margin-bottom: 0.85em; text-align: left; }
    .reveal h3 { font-size: 1.0em; color: #2E86AB; margin: 0.65em 0 0.25em; text-align: left; }
    .reveal p, .reveal li { color: #333; line-height: 1.55; text-align: left; }
    .reveal ul { margin: 0; padding-left: 1em; }
    .reveal li { margin-bottom: 4px; }
    .reveal strong { color: #1a3a5c; }
    .reveal .slide-number { font-size: 0.8em; color: #aaa; right: auto !important; left: 8px !important; bottom: 24px !important; }
    .reveal img { max-width: 100%; border-radius: 5px; }
    .slide-sub { font-size: 0.58em; color: #888; font-weight: 400; }

    /* === Title Slides (section dividers + main title) === */
    .reveal section.title-slide { display: flex !important; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .title-slide h1 { color: #fff; font-size: 2.6em; letter-spacing: 0.01em; margin-bottom: 0.3em; text-align: center; }
    .title-slide .sub { color: #b8d8ea; font-size: 1.0em; line-height: 1.8; text-align: center; }
    .title-slide .meta { color: rgba(255,255,255,0.48); font-size: 0.75em; margin-top: 1.6em; text-align: center; }

    /* === Kernthese Slide === */
    .reveal section.thesis-slide { display: flex !important; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .thesis-label { font-size: 0.68em; letter-spacing: 0.16em; text-transform: uppercase; color: #2E86AB; font-weight: 700; margin-bottom: 0.9em; }
    .thesis-main { font-size: 1.55em; color: #1a3a5c; line-height: 1.4; font-weight: 700; max-width: 800px; text-align: center; }
    .thesis-sub { font-size: 0.84em; color: #555; margin-top: 1em; line-height: 1.75; max-width: 660px; text-align: center; }
    .thesis-punch { font-size: 1.1em; color: #2E86AB; font-weight: 700; margin-top: 1.3em; border-top: 1px solid #d0e8f5; padding-top: 1em; text-align: center; }

    /* === Layout === */
    .cols { display: flex; gap: 32px; align-items: flex-start; }
    .cols > div { flex: 1; }
    .cols > div.w55 { flex: 1.22; }
    .cols > div.w45 { flex: 0.82; }
    .cols > div.w60 { flex: 1.5; }
    .cols > div.w40 { flex: 0.67; }

    /* === Boxen === */
    .box { border-left: 4px solid #2E86AB; background: #f0f7fb; padding: 9px 13px; border-radius: 0 6px 6px 0; margin: 6px 0; font-size: 0.86em; }
    .box-green { border-left-color: #27ae60; background: #f2faf5; }
    .box-orange { border-left-color: #e67e22; background: #fef9f0; }

    /* === Metriken === */
    .metric-row { display: flex; gap: 10px; margin: 8px 0; }
    .metric { text-align: center; background: #f5f9fc; border-radius: 8px; padding: 11px 12px; flex: 1; border: 1px solid #d0e8f5; }
    .metric .val { font-size: 1.8em; font-weight: 700; color: #1a3a5c; line-height: 1.05; }
    .metric .lbl { font-size: 0.65em; color: #777; margin-top: 4px; }
    .metric.good .val { color: #27ae60; }
    .metric.warn .val { color: #e67e22; }
    .metric.bad  .val { color: #c0392b; }

    /* === Tabellen === */
    .reveal table { width: 100%; border-collapse: collapse; font-size: 0.82em; margin: 0.3em 0; }
    .reveal table th { background: #1a3a5c; color: #fff; padding: 7px 10px; text-align: left; font-weight: 600; }
    .reveal table td { padding: 6px 10px; border-bottom: 1px solid #e8e8e8; vertical-align: middle; text-align: left; }
    .reveal table tr:nth-child(even) td { background: #f7fafb; }
    tr.hl td { background: #e8f4fb !important; font-weight: 600; }
    tr.hl-green td { background: #e5f5ec !important; font-weight: 700; }
    tr.pending td { color: #aaa; font-style: italic; }

    /* === Pipeline (Process Slide) === */
    .pipe-step { padding: 5px 14px; font-size: 0.78em; font-weight: 700; border-radius: 4px; color: #fff; text-align: center; }
    .pipe-step.done { background: #27ae60; }
    .pipe-step.active { background: #e67e22; }
    .pipe-step.planned { background: #aaa; }

    /* === Steps (Data Engineering Pipeline) === */
    .step { background: #f5f9fc; border: 1px solid #d0e8f5; border-radius: 6px; padding: 5px 12px; margin: 3px 0; display: flex; align-items: center; gap: 12px; }
    .step strong { font-size: 0.84em; color: #1a3a5c; white-space: nowrap; min-width: 100px; }
    .step .details { font-size: 0.78em; color: #555; }
    .step.join { background: #e8f4fb; border-color: #2E86AB; border-left: 3px solid #2E86AB; }
    .step.join strong { color: #2E86AB; }
    .step.target { background: #f2faf5; border-color: #27ae60; border-left: 3px solid #27ae60; }
    .step.target strong { color: #27ae60; }

    /* === Evidence Chain === */
    .ev-chain { display: flex; flex-direction: column; }
    .ev-step { display: flex; align-items: flex-start; gap: 12px; padding: 9px 12px; background: #f5f9fc; border: 1px solid #d0e8f5; border-radius: 8px; }
    .ev-circle { width: 26px; height: 26px; border-radius: 50%; background: #2E86AB; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85em; flex-shrink: 0; margin-top: 1px; }
    .ev-body strong { display: block; color: #1a3a5c; font-size: 0.9em; margin-bottom: 2px; }
    .ev-body span { font-size: 0.77em; color: #555; line-height: 1.4; }
    .ev-arrow { padding: 1px 0 1px 13px; color: #b0c8d8; font-size: 0.95em; line-height: 1; }
    .ev-step.climax { background: #edf7f2; border-color: #27ae60; }
    .ev-step.climax .ev-circle { background: #27ae60; }
    .ev-step.climax .ev-body strong { color: #1e7a45; }

    /* === Model Cards === */
    .model-card { border-radius: 10px; padding: 14px 16px; border: 2px solid #d0e8f5; background: #f8fbfe; }
    .model-card .card-badge { display: inline-block; font-size: 0.66em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; background: #2E86AB; color: #fff; padding: 2px 10px; border-radius: 12px; margin-bottom: 8px; }
    .model-card h3 { margin: 0 0 6px; color: #1a3a5c !important; font-size: 0.95em !important; }
    .model-card .card-mae { font-size: 2.2em; font-weight: 700; color: #1a3a5c; line-height: 1.1; margin: 4px 0 8px; }
    .model-card ul { font-size: 0.80em; margin-top: 6px; }
    .model-card .card-note { font-size: 0.76em; color: #666; margin-top: 8px; font-style: italic; border-top: 1px solid #e0ecf5; padding-top: 7px; }
    .model-card.card-green { border-color: #27ae60; background: #f3fbf6; }
    .model-card.card-green .card-badge { background: #27ae60; }
    .model-card.card-green .card-mae { color: #1e7a45; }

    /* === Recommendations === */
    .reco { display: flex; align-items: flex-start; gap: 12px; background: #fff; border: 1px solid #d0e8f5; border-radius: 8px; padding: 10px 14px; margin: 5px 0; }
    .reco-num { font-size: 1.45em; font-weight: 700; color: #2E86AB; line-height: 1; min-width: 26px; }
    .reco-text strong { display: block; color: #1a3a5c; font-size: 0.92em; margin-bottom: 2px; }
    .reco-text span { font-size: 0.78em; color: #555; }

    /* === Chart Tiles === */
    .chart-tile { display: block; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.12); text-decoration: none; cursor: pointer; }
    .chart-tile img { width: 100%; display: block; }
    .chart-tile-html { display: flex; align-items: center; justify-content: center; gap: 6px; background: #f0f7fb; border: 1px solid #d0e8f5; border-radius: 6px; padding: 13px 10px; text-decoration: none; color: #2E86AB; font-size: 0.78em; font-weight: 700; }

    /* === Live Prediction Card === */
    .prediction-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 20px 24px; max-width: 540px; margin: 0 auto; }
    .pred-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .pred-field label { display: block; font-size: 0.66em; color: #888; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
    .pred-field select { width: 100%; border: 1px solid #cde; border-radius: 5px; padding: 6px 8px; background: #f5f9fc; color: #1a3a5c; font-size: 0.86em; cursor: not-allowed; }
    .pred-btn { width: 100%; padding: 9px; background: #2E86AB; color: #fff; border: none; border-radius: 7px; font-size: 0.9em; font-weight: 700; cursor: default; margin-bottom: 12px; }
    .pred-result { background: linear-gradient(135deg, #1a3a5c, #2E86AB); border-radius: 9px; padding: 14px 20px; text-align: center; color: #fff; }
    .pred-result .res-val { font-size: 2.9em; font-weight: 700; line-height: 1; }
    .pred-result .res-lbl { font-size: 0.78em; opacity: 0.82; margin-top: 4px; }

    /* === Progress Bar === */
    .reveal .progress { height: 16px !important; }
    .progress-marker { position: absolute; top: 0; height: 16px; width: 2px; background: rgba(255,255,255,0.85); z-index: 10; pointer-events: none; }
    .progress-label { position: absolute; top: 50%; transform: translateY(-50%); font-size: 8px; color: rgba(255,255,255,0.9); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; padding-left: 3px; pointer-events: none; z-index: 11; }
  </style>
</head>
<body>
<div class="reveal">
<div class="slides">

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
<script>
  Reveal.initialize({
    hash: true,
    slideNumber: 'c/t',
    transition: 'slide',
    transitionSpeed: 'default',
    controls: true,
    progress: true,
    center: true,
    plugins: [RevealNotes]
  });

  // Section markers in progress bar
  Reveal.on('ready', () => {
    const allSlides = Array.from(document.querySelectorAll('.slides > section'));
    const total = allSlides.length;
    const progressEl = document.querySelector('.reveal .progress');
    if (!progressEl) return;

    allSlides.forEach((slide, index) => {
      if (index === 0) return;
      if (!slide.classList.contains('title-slide')) return;
      const pct = (index / total) * 100;

      const marker = document.createElement('div');
      marker.className = 'progress-marker';
      marker.style.left = pct + '%';
      progressEl.appendChild(marker);

      const h1 = slide.querySelector('h1');
      const label = document.createElement('div');
      label.className = 'progress-label';
      label.textContent = h1 ? h1.textContent.trim() : '';
      label.style.left = 'calc(' + pct + '% + 3px)';
      progressEl.appendChild(label);
    });
  });

  // Chart tile click handlers — open images in clean new window
  document.querySelectorAll('a.chart-tile').forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      var img = a.querySelector('img');
      if (!img) return;
      var w = window.open('', '_blank');
      w.document.write('<!DOCTYPE html><html><head><style>*{margin:0;padding:0}body{background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}</style></head><body><img src="' + img.src + '" style="max-width:100vw;max-height:100vh;object-fit:contain"></body></html>');
      w.document.close();
      w.focus();
    });
  });

  // Chart tile HTML — open in new tab
  document.querySelectorAll('a.chart-tile-html').forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      var w = window.open(a.href, '_blank');
      if (w) w.focus();
    });
  });
</script>
</body>
