const TEXTCOL  = {"2": "#fff", "3": "#fff", "4": "#fff", "5": "#fff", "6": "#fff", "7": "#fff", "8": "#000", "9": "#fff", "10": "#fff", "11": "#fff", "12": "#000", "13": "#000", "14": "#fff", "15": "#fff", "17": "#fff", "18": "#fff", "19": "#fff", "E": "#fff"};

const YSTYLE = {
  j23:{w:2,   op:0.6,  dash:'5,4'},
  j24:{w:3.5, op:0.75, dash:'6,3'},
  j25:{w:5,   op:0.9,  dash:null},
};

const map = L.map('map',{center:[47.378,8.540],zoom:13});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap contributors © CARTO',maxZoom:19
}).addTo(map);

let activeYear='all';
const vis={};
ALL_LINES.forEach(l=>vis[l]=true);

// Build all leaflet objects upfront
const objs={};  // key "j23_9" -> {poly, markers:[]}
ALL_LINES.forEach(ln=>{
  const col=COLORS[ln]||'#888';
  ['j23','j24','j25'].forEach(yr=>{
    const key=yr+'_'+ln;
    const data=ROUTES[key];
    if(!data||!data.coords.length) return;
    const ys=YSTYLE[yr];
    const poly=L.polyline(data.coords,{
      color:col,weight:ys.w,opacity:ys.op,dashArray:ys.dash
    });
    poly.bindTooltip('Linie '+ln+' — '+yr.replace('j','20'),{sticky:true});

    const markers=data.stops.map((s,i)=>{
      const isEnd=(i===0||i===data.stops.length-1);
      const st=STATUS[ln+'|'+s.name]||'consistent';
      let fc='white',sc=col,r=4;
      if(isEnd){fc=col;sc='white';r=7}
      else if(st==='new_j24'){fc='#FF6B00';sc='#FF6B00';r=5}
      else if(st==='removed_j24'){fc='#ddd';sc='#aaa';r=4}
      const m=L.circleMarker([s.lat,s.lon],{
        radius:r,color:sc,weight:isEnd?2.5:1.5,fillColor:fc,fillOpacity:.95
      });
      m.bindTooltip('<b>'+s.name+'</b><br>Linie '+ln+' · '+yr.replace('j','20'),{sticky:true});
      return m;
    });
    objs[key]={poly,markers};
  });
});

function show(yr,ln,on){
  const key=yr+'_'+ln;
  if(!objs[key]) return;
  const {poly,markers}=objs[key];
  if(on){poly.addTo(map);markers.forEach(m=>m.addTo(map));}
  else{map.removeLayer(poly);markers.forEach(m=>map.removeLayer(m));}
}

function redraw(){
  const yrs=activeYear==='all'?['j23','j24','j25']:[activeYear];
  ['j23','j24','j25'].forEach(yr=>ALL_LINES.forEach(ln=>show(yr,ln,false)));
  yrs.forEach(yr=>ALL_LINES.forEach(ln=>{if(vis[ln]) show(yr,ln,true);}));
  document.getElementById('leg-all').style.display=activeYear==='all'?'':'none';
  document.getElementById('leg-one').style.display=activeYear!=='all'?'':'none';
}

// Year buttons
document.querySelectorAll('.ybtn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.ybtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    activeYear=b.dataset.y;
    redraw();
  });
});

// Line list
const list=document.getElementById('line-list');
ALL_LINES.forEach(ln=>{
  const col=COLORS[ln]||'#888';
  const tc=TEXTCOL[ln]||'#fff';
  const div=document.createElement('div');
  div.className='li';div.dataset.ln=ln;
  div.innerHTML=`<div class="chip" style="background:${col};color:${tc}">${ln}</div>`+
    `<span class="lname">Linie ${ln}</span>`+
    `<span class="lbadge" title="${CHANGED[ln]?'Strecke geändert':'konsistent'}">${CHANGED[ln]?'⚠️':'✓'}</span>`;
  div.addEventListener('click',()=>{
    vis[ln]=!vis[ln];
    div.classList.toggle('off',!vis[ln]);
    redraw();
  });
  list.appendChild(div);
});

document.getElementById('tog-all').addEventListener('click',()=>{
  const any=ALL_LINES.some(l=>vis[l]);
  ALL_LINES.forEach(l=>vis[l]=!any);
  list.querySelectorAll('.li').forEach(d=>d.classList.toggle('off',!vis[d.dataset.ln]));
  redraw();
});

redraw();
